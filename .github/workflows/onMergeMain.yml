name: Test on merge to main

permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org/'
          always-auth: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: true



      - name: Publish packages
        run: pnpm run publish-packages
